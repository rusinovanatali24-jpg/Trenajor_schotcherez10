<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Переход через десяток</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;700;800&display=swap">
<style>
:root{--paper:#f7fafd;--grid:#d6e4f2;--ink:#1d3b8b;--ink-text:#fff;--red:#cf3b3b;--ok:#1f7f46;--text:#22304a;--muted:#5d6b85;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#14202e;--grid:#223548;--ink:#9cc0ff;--ink-text:#0f1b2a;--red:#ff8f86;--ok:#7fd69a;--text:#e3ebf7;--muted:#9fb0c8;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#14202e;--grid:#223548;--ink:#9cc0ff;--ink-text:#0f1b2a;--red:#ff8f86;--ok:#7fd69a;--text:#e3ebf7;--muted:#9fb0c8;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--text);font:400 17px/1.45 Nunito,system-ui,"Segoe UI",sans-serif}
.sheet{max-width:900px;margin:0 auto 0 max(0px,calc(50vw - 450px));padding:28px 18px 56px 26px;border-left:2px solid var(--red);min-height:100vh}
@media (max-width:900px){.sheet{margin-left:12px}}
h1{margin:0;font:700 clamp(38px,7vw,58px)/1.05 Caveat,"Segoe Script",cursive;color:var(--ink)}
.sub{margin:4px 0 20px;color:var(--muted)}
.panel{background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;margin-bottom:14px}
.seg{display:flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);font:700 16px Nunito,sans-serif;padding:8px 14px;cursor:pointer}
.seg button+button{border-left:2px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ink-text)}
label.cnt{display:flex;gap:8px;align-items:center;font-weight:700}
select{font:700 16px Nunito,sans-serif;color:var(--text);background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:6px 8px}
.score{font:700 28px Caveat,cursive;color:var(--ink);margin:6px 0 10px}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px 18px}
.ex{background:var(--paper);border-bottom:3px solid var(--grid);padding:8px 10px 6px;display:grid;grid-template-columns:auto 1fr auto auto;gap:2px 10px;align-items:center;border-radius:6px}
.ex.ok{border-bottom-color:var(--ok)}
.ex.bad{border-bottom-color:var(--red)}
.num{color:var(--muted);font-weight:700;min-width:1.6em}
.expr{font:700 38px/1 Caveat,cursive;color:var(--ink);white-space:nowrap}
.ans{width:4.2ch;font:700 38px/1.1 Caveat,cursive;color:var(--text);background:transparent;border:0;border-bottom:3px solid var(--ink);text-align:center;padding:0;border-radius:0;outline-offset:4px}
.mark{font:800 24px Nunito,sans-serif;width:1.2em;text-align:center}
.ok .mark{color:var(--ok)}
.bad .mark{color:var(--red)}
.tools{grid-column:2/-1;display:flex;gap:14px;margin-top:2px}
.tools button{border:0;background:none;color:var(--muted);font:700 14px Nunito,sans-serif;padding:4px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.tools button:hover{color:var(--ink)}
.hint{grid-column:1/-1;margin:6px 0 2px;padding:2px 0 2px 12px;border-left:3px solid var(--red);font:500 25px/1.2 Caveat,cursive;color:var(--red)}
.hint div+div{margin-top:2px}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:20px}
.btn{font:800 17px Nunito,sans-serif;border-radius:10px;padding:12px 20px;cursor:pointer;border:2px solid var(--ink)}
.btn.main{background:var(--ink);color:var(--ink-text)}
.btn.alt{background:var(--paper);color:var(--ink)}
.msg{font:700 28px Caveat,cursive;color:var(--ink);background:var(--paper);padding:0 6px}
button:focus-visible,select:focus-visible,.ans:focus-visible{outline:3px solid var(--red)}
@media (max-width:420px){.expr,.ans{font-size:34px}}
</style>
</head>
<body>
<main class="sheet">
  <h1>Переход через десяток</h1>
  <p class="sub">Сложение и вычитание двузначных чисел. Каждый пример требует перехода через десяток.</p>

  <div class="panel">
    <div class="seg" role="group" aria-label="Действие">
      <button type="button" data-mode="add" aria-pressed="true">Сложение</button>
      <button type="button" data-mode="sub" aria-pressed="false">Вычитание</button>
      <button type="button" data-mode="mix" aria-pressed="false">Вместе</button>
    </div>
    <label class="cnt">Примеров
      <select id="count"><option>6</option><option selected>10</option><option>15</option><option>20</option></select>
    </label>
  </div>

  <div class="score" id="score" aria-live="polite"></div>
  <div id="list"></div>

  <div class="actions">
    <button type="button" class="btn main" id="checkAll">Проверить всё</button>
    <button type="button" class="btn alt" id="renew">Новые примеры</button>
    <span class="msg" id="msg" aria-live="polite"></span>
  </div>
</main>

<script>
(function(){
  var mode='add', items=[];
  var $=function(s){return document.querySelector(s)};
  var rnd=function(a,b){return Math.floor(Math.random()*(b-a+1))+a};

  function make(op){
    for(;;){
      if(op==='+'){
        var a=rnd(11,88), b=rnd(11,99-a);
        if(a%10+b%10>=10) return {a:a,b:b,op:'+',ans:a+b,val:'',state:'',hint:false};
      }else{
        var c=rnd(21,99), d=rnd(11,c-1);
        if(c%10<d%10) return {a:c,b:d,op:'−',ans:c-d,val:'',state:'',hint:false};
      }
    }
  }
  function pickOp(){ return mode==='add'?'+':mode==='sub'?'−':(Math.random()<0.5?'+':'−'); }
  function gen(skip){
    var it;
    do{ it=make(pickOp()); }
    while(items.some(function(x,j){return j!==skip&&x&&x.a===it.a&&x.b===it.b&&x.op===it.op}));
    return it;
  }

  function steps(it){
    var a=it.a,b=it.b,t=Math.floor(b/10)*10,u=b%10,s1,need,ten,rest;
    if(it.op==='+'){
      s1=a+t; need=10-s1%10; ten=s1+need; rest=u-need;
      if(rest===0) return ['Сначала десятки: '+a+' + '+t+' = '+s1, 'Теперь единицы: '+s1+' + '+u+' = '+ten, 'Получилась круглая десятка: '+ten];
      return ['Сначала десятки: '+a+' + '+t+' = '+s1,
              'Единицы разбиваем: '+u+' = '+need+' + '+rest,
              'Доходим до десятка: '+s1+' + '+need+' = '+ten,
              'Прибавляем остаток: '+ten+' + '+rest+' = '+(ten+rest)];
    }
    s1=a-t; need=s1%10; ten=s1-need; rest=u-need;
    return ['Сначала десятки: '+a+' − '+t+' = '+s1,
            'Единицы разбиваем: '+u+' = '+need+' + '+rest,
            'Доходим до десятка: '+s1+' − '+need+' = '+ten,
            'Вычитаем остаток: '+ten+' − '+rest+' = '+(ten-rest)];
  }

  function buildRow(i){
    var it=items[i], row=document.createElement('div');
    row.className='ex'+(it.state?' '+it.state:'');
    row.dataset.i=i;
    row.innerHTML='<span class="num">'+(i+1)+'.</span>'+
      '<span class="expr">'+it.a+' '+it.op+' '+it.b+' =</span>'+
      '<input class="ans" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" aria-label="Ответ к примеру '+(i+1)+'">'+
      '<span class="mark" aria-hidden="true"></span>'+
      '<span class="tools"><button type="button" data-act="hint">Подсказка</button><button type="button" data-act="swap">Другой пример</button></span>'+
      '<div class="hint" hidden></div>';
    row.querySelector('.ans').value=it.val;
    paint(row,it);
    return row;
  }
  function paint(row,it){
    row.className='ex'+(it.state?' '+it.state:'');
    row.querySelector('.mark').textContent=it.state==='ok'?'✓':it.state==='bad'?'✗':'';
    var h=row.querySelector('.hint');
    if(it.hint){
      h.innerHTML=steps(it).map(function(s){return '<div>'+s+'</div>'}).join('');
      h.hidden=false;
    }else{ h.hidden=true; h.innerHTML=''; }
  }
  function render(){
    var box=$('#list'); box.innerHTML='';
    items.forEach(function(_,i){box.appendChild(buildRow(i))});
    $('#msg').textContent='';
    score();
  }
  function score(){
    var ok=items.filter(function(x){return x.state==='ok'}).length;
    $('#score').textContent='Верно: '+ok+' из '+items.length;
  }
  function renew(){
    var n=parseInt($('#count').value,10); items=[];
    for(var i=0;i<n;i++) items.push(gen(-1));
    render();
    var f=document.querySelector('.ans'); if(f) f.focus({preventScroll:true});
  }
  function check(i){
    var row=document.querySelector('.ex[data-i="'+i+'"]'), it=items[i];
    it.val=row.querySelector('.ans').value.trim();
    it.state = it.val==='' ? '' : (Number(it.val)===it.ans ? 'ok' : 'bad');
    paint(row,it);
    return it.state;
  }

  $('#list').addEventListener('input',function(e){
    if(!e.target.classList.contains('ans')) return;
    e.target.value=e.target.value.replace(/\D/g,'');
    var row=e.target.closest('.ex'), it=items[row.dataset.i];
    it.val=e.target.value; it.state=''; paint(row,it); score();
  });
  $('#list').addEventListener('keydown',function(e){
    if(e.key!=='Enter'||!e.target.classList.contains('ans')) return;
    var i=+e.target.closest('.ex').dataset.i;
    check(i); score();
    var next=document.querySelectorAll('.ans')[i+1]; if(next) next.focus();
  });
  $('#list').addEventListener('click',function(e){
    var b=e.target.closest('button[data-act]'); if(!b) return;
    var row=b.closest('.ex'), i=+row.dataset.i, it=items[i];
    if(b.dataset.act==='hint'){ it.hint=!it.hint; paint(row,it); }
    else{ items[i]=gen(i); row.replaceWith(buildRow(i)); score(); document.querySelectorAll('.ans')[i].focus(); }
  });
  $('#checkAll').addEventListener('click',function(){
    var empty=0;
    items.forEach(function(_,i){ if(check(i)==='') empty++; });
    score();
    var ok=items.filter(function(x){return x.state==='ok'}).length, n=items.length, m;
    if(ok===n) m='Всё верно, отлично!';
    else m='Верно '+ok+' из '+n+(empty?'. Без ответа: '+empty:'. Ошибки отмечены ✗');
    $('#msg').textContent=m;
  });
  $('#renew').addEventListener('click',renew);
  $('#count').addEventListener('change',renew);
  document.querySelectorAll('[data-mode]').forEach(function(b){
    b.addEventListener('click',function(){
      mode=b.dataset.mode;
      document.querySelectorAll('[data-mode]').forEach(function(x){x.setAttribute('aria-pressed',x===b)});
      renew();
    });
  });
  renew();
})();
</script>
</body>
</html>
